name: Build MEDFLASH SOS prototype APK
on:
  workflow_dispatch:
  push:
    branches: [feature/sos-solidaire-prototype]
    paths:
      - 'android-sos/**'
      - '.github/workflows/build-sos-prototype.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile prototype APK
        working-directory: android-sos
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: MEDFLASH-SOS-PROTOTYPE-DEBUG
          path: android-sos/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
