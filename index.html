).classList.remove("flash","sos-image","malaise-image","saignement-image","poste-image","passer-image","urgence-image","secours-image","liberer-image")};el("stop").onclick=()=>{el("screen").classList.remove("flash");el("stop").hidden=true};document.addEventListener("keydown",e=>{if(e.key==="Escape")el("back").click()});el("enterfestival").onclick=()=>{mode(fest);el("landing").hidden=true;el("festivalPage").hidden=false};el("entermedical").onclick=()=>{el("landing").hidden=true;el("medicalGate").hidden=false};el("gateexit").onclick=()=>{el("medicalGate").hidden=true;el("landing").hidden=false};el("gatelocked").onclick=()=>{el("medicalGate").querySelector(".notice-lock").focus?.()};el("homeback").onclick=()=>{el("home").hidden=true;el("landing").hidden=false};el("festivalreturn").onclick=()=>{el("festivalPage").hidden=true;el("landing").hidden=false};document.querySelectorAll("#festivalPage .art button:not(.return)").forEach((b,i)=>b.onclick=()=>{el("big").textContent=fest[i];el("screen").hidden=false;el("screen").classList.toggle("sos-image",i===0);el("screen").classList.toggle("malaise-image",i===1);el("screen").classList.toggle("saignement-image",i===2);el("screen").classList.toggle("poste-image",i===3);el("screen").classList.toggle("passer-image",i===4);el("screen").classList.remove("flash");el("stop").hidden=true;el("back").focus()});el("medicalreturn").addEventListener("click",e=>{e.preventDefault();e.stopPropagation();el("medicalPage").hidden=true;el("landing").hidden=false;});document.querySelectorAll("#medicalPage .art button:not(.return)").forEach((b,i)=>b.onclick=()=>{el("big").textContent=med[i];el("screen").hidden=false;el("screen").classList.toggle("urgence-image",i===0);el("screen").classList.toggle("secours-image",i===1);el("screen").classList.toggle("liberer-image",i===2);el("screen").classList.remove("flash");el("stop").hidden=true;el("back").focus()});// Make the medical fullscreen return control work reliably on touch devices.
const medicalFullscreenClasses=["urgence-image","secours-image","liberer-image"];
function closeMedicalFullscreen(e){
  if(!medicalFullscreenClasses.some(name=>el("screen").classList.contains(name)))return;
  e.preventDefault();
  e.stopPropagation();
  el("back").click();
}
el("screen").addEventListener("pointerup",e=>{
  if(!medicalFullscreenClasses.some(name=>el("screen").classList.contains(name)))return;
  const rect=el("screen").getBoundingClientRect();
  if(e.clientY<=rect.top+rect.height*.12 && (e.clientX<=rect.left+rect.width*.34 || e.clientX>=rect.right-rect.width*.18))closeMedicalFullscreen(e);
});

async function initializeAuth(){
 if(sb)return sb;
 const mod=await import("https://esm.sh/@supabase/supabase-js@2.80.0");
 sb=mod.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 const {data}=await sb.auth.getUser();account=data.user;
 sb.auth.onAuthStateChange((_event,session)=>{account=session?.user||null});
 return sb;
}

 action("JE SUIS DÉJÀ CONNECTÉ",async()=>{try{await initializeAuth();const {data,error}=await sb.auth.getUser();if(error||!data.user){note(o,"Aucune session active. Utilise le lien envoyé par e-mail.");return}account=data.user;await dashboard()}catch(e){showError(o,e)}},o);
}

 try{

 note(o,"Compte : "+account.email);
 action("MES INVITATIONS MÉDICALES",listInvitations,o);

 if(reqErr)throw reqErr;
 const req=requests?.[0];
 if(!req){action("DEMANDER LA VÉRIFICATION ORGANISATEUR",organizerRequest,o)}
 else if(req.status==="pending"){el("workflowPanel").style.backgroundImage='url("'+workflowImages.pending+'")';note(o,"Vérification en attente. Seul un administrateur MEDFLASH peut valider cette demande.")}
 else if(req.status==="rejected"){el("workflowPanel").style.backgroundImage='url("'+workflowImages.rejected+'")';note(o,"Demande refusée. Contacte l'administration MEDFLASH pour un réexamen.")}
 else if(req.status==="verified"){el("workflowPanel").style.backgroundImage='url("'+workflowImages.verified+'")';note(o,"Organisateur vérifié.");action("MES FESTIVALS",listFestivals,o);action("CRÉER UN FESTIVAL",createFestival,o)}
 action("DÉCONNEXION",async()=>{await sb.auth.signOut();account=null;medicalAccess=null;startWorkflow()},o);
 }catch(e){showError(o,e)}
}

 email.value=account?.email||"";

 action("RETOUR",dashboard,o);

 const name=field("Nom du festival","text",o),place=field("Lieu","text",o),start=field("Date et heure de début","datetime-local",o),end=field("Date et heure de fin","datetime-local",o);
 action("ENREGISTRER LE FESTIVAL",async()=>{try{

 const {data,error}=await sb.from("medical_invitations").select("invited_email,invited_role,status,expires_at").eq("festival_id",f.id).order("created_at",{ascending:false});
 if(error)showError(o,error);
 else for(const i of data||[])note(o,i.invited_email+" — "+i.invited_role+" — "+i.status+(new Date(i.expires_at)<new Date()?" (expirée)":""));

function inviteCaregiver(f){
 const o=showWorkflow("invite","Inviter un membre du service médical");
 const email=field("E-mail du soignant","email",o);
 const role=selectField("Fonction",[["medecin","Médecin"],["infirmier","Infirmier"],["secouriste","Secouriste"],["autre","Autre"]],o);
 action("CRÉER L'INVITATION",async()=>{try{
 if(!email.validity.valid||!email.value)throw Error("Adresse e-mail invalide.");
 const {error}=await sb.from("medical_invitations").insert({festival_id:f.id,invited_email:email.value.trim().toLowerCase(),invited_role:role.value,invited_by:account.id});
 if(error)throw error;
 const done=showWorkflow("sent","Invitation enregistrée");
 note(done,"L'invitation est enregistrée pour "+email.value+". Le soignant doit se connecter à MEDFLASH avec cette adresse pour l'accepter. Aucun e-mail automatique n'est encore envoyé.");
 action("RETOUR AU FESTIVAL",()=>festivalDetail(f),done);
 }catch(e){showError(o,e)}},o);
 action("RETOUR",()=>festivalDetail(f),o);
}
async function listInvitations(){
 const o=showWorkflow("accept","Mes invitations médicales");
 try{
 const {data,error}=await sb.from("medical_invitations").select("id,festival_id,invited_role,status,expires_at,accepted_by").order("created_at",{ascending:false});
 if(error)throw error;
 const mine=(data||[]).filter(i=>i.accepted_by===account.id||i.status==="pending"||i.status==="declined");
 if(!mine.length)note(o,"Aucune invitation pour cette adresse.");
 for(const i of mine){
 const {data:f}=await sb.from("festivals").select("name,location").eq("id",i.festival_id).maybeSingle();
 const name=f?.name||"Festival";
 const expired=new Date(i.expires_at)<=new Date();
 note(o,name+" — "+i.invited_role+" — "+(expired&&i.status==="pending"?"expirée":i.status));
 if(i.status==="pending"&&!expired){
 action("ACCEPTER : "+name,()=>answerInvitation(i,"accepted"),o);
 action("REFUSER : "+name,()=>answerInvitation(i,"declined"),o);
 }
 if(i.status==="accepted"&&i.accepted_by===account.id&&!expired)action("OUVRIR LE SERVICE MÉDICAL : "+name,()=>openMedical(i),o);
 }
 action("RETOUR",dashboard,o);
 }catch(e){showError(o,e)}
}
async function answerInvitation(i,status){
 const o=showWorkflow("accept","Confirmation d'invitation");
 try{
 const {data,error}=await sb.from("medical_invitations").update({status,accepted_by:account.id}).eq("id",i.id).eq("status","pending").select("id");
 if(error)throw error;if(!data?.length)throw Error("Invitation expirée, utilisée ou non autorisée.");
 const done=showWorkflow(status==="accepted"?"accepted":"declined",status==="accepted"?"Invitation acceptée":"Invitation refusée");
 note(done,status==="accepted"?"Ton accès médical est enregistré.":"Tu as refusé l'invitation.");
 action("MES INVITATIONS",listInvitations,done);
 }catch(e){showError(o,e)}
}
async function openMedical(i){
 const {data,error}=await sb.from("medical_invitations").select("id,status,expires_at,accepted_by").eq("id",i.id).maybeSingle();
 if(error||!data||data.status!=="accepted"||data.accepted_by!==account.id||new Date(data.expires_at)<=new Date()){
 const o=showWorkflow("denied","Accès médical non autorisé");note(o,"Autorisation invalide ou expirée.");return;
 }
 medicalAccess=i.id;
 el("workflow").hidden=true;el("medicalGate").hidden=true;el("medicalPage").hidden=false;
}
el("organizerEntry").onclick=startWorkflow;
el("workflowClose").onclick=()=>{el("workflow").hidden=true;el("medicalGate").hidden=false};
el("gatelocked").onclick=startWorkflow;
el("medicalreturn").onclick=()=>{medicalAccess=null;el("medicalPage").hidden=true;el("landing").hidden=false};
render();initializeAuth().catch(()=>{});</script></body></html>
