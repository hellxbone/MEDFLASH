<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10121a"><title>MEDFLASH</title><style>*{box-sizing:border-box}body{margin:0;background:#10121a;color:white;font:18px system-ui;text-align:center}main{max-width:760px;margin:auto;padding:24px 16px}h1{font-size:clamp(40px,10vw,76px);margin:22px 0 0}p{color:#ccc}button{font:inherit;font-weight:800;color:white;background:#202a39;border:2px solid white;border-radius:16px;padding:16px;min-height:64px;cursor:pointer}button:focus-visible{outline:4px solid yellow}.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:28px 0}.modes [aria-pressed=true]{background:#9e1d2b}.messages{display:grid;gap:12px}.messages button:first-child{background:#a40b20}.notice{font-size:14px;color:#f7d5a0;margin-top:30px}#screen{position:fixed;inset:0;background:#b00020;display:flex;align-items:center;justify-content:center;padding:8vh 5vw;z-index:2}#screen[hidden]{display:none}#screen strong{font-size:clamp(35px,8vw,100px);line-height:1.1;overflow-wrap:anywhere}#back,#stop{position:absolute;background:#151515;padding:8px 12px;min-height:45px;font-size:16px}#back{top:10px;left:10px}#stop{bottom:10px;right:10px}@keyframes flash{0%,45%{background:#d50019;color:white}46%,65%{background:white;color:black}66%,100%{background:#080c16;color:white}}#screen.flash{animation:flash .7s steps(1) infinite}@media(prefers-reduced-motion:reduce){#screen.flash{animation:none}}@media(orientation:landscape){#screen strong{font-size:clamp(36px,9vh,120px)}}body:has(#landing:not([hidden])){overflow:hidden}#landing{position:fixed;inset:0;background:#05030b;z-index:1;display:flex;justify-content:center}#landing[hidden]{display:none}#landing .art{position:relative;height:100%;aspect-ratio:864/1536;max-width:100vw;background:url('accueil.png') center/100% 100% no-repeat}#landing .hot{position:absolute;left:3%;width:94%;border:0;background:transparent;border-radius:24px;cursor:pointer}#landing .hot:focus-visible{outline:4px solid #fff;outline-offset:-4px}#landing .fest{top:39.5%;height:17%}#landing .med{top:57.5%;height:18%}#homeback{display:block;margin:0 auto 20px;background:#283044}@media(max-aspect-ratio:864/1536){#landing .art{width:100vw;height:auto;align-self:center;aspect-ratio:864/1536}#landing{background:#05030b}} #festivalPage{position:fixed;inset:0;z-index:1;background:#030408;display:flex;justify-content:center}#festivalPage[hidden]{display:none}#festivalPage .art{position:relative;height:100%;aspect-ratio:864/1536;max-width:100vw;background:url('festivalier.png') center/100% 100% no-repeat}#festivalPage button{position:absolute;left:3%;width:94%;border:0;background:transparent;padding:0;min-height:0}#festivalPage button:focus-visible{outline:4px solid white;outline-offset:-4px}#festivalPage .return{left:1%;top:0%;width:22%;height:6%}#festivalPage .msg1{top:23.6%;height:12%}#festivalPage .msg2{top:36.4%;height:11.5%}#festivalPage .msg3{top:48.5%;height:11.5%}#festivalPage .msg4{top:60.5%;height:11.5%}#festivalPage .msg5{top:72.5%;height:11.5%}@media(max-aspect-ratio:864/1536){#festivalPage .art{width:100vw;height:auto;align-self:center;aspect-ratio:864/1536}}#medicalPage{position:fixed;inset:0;z-index:1;background:#030408;display:flex;justify-content:center}#medicalPage[hidden]{display:none}#medicalPage .art{position:relative;height:100%;aspect-ratio:864/1536;max-width:100vw;background:url('medical.png') center/100% 100% no-repeat}#medicalPage button{position:absolute;left:3%;width:94%;border:0;background:transparent;padding:0;min-height:0;cursor:pointer}#medicalPage button:focus-visible{outline:4px solid white;outline-offset:-4px}#medicalPage .return{left:1%;top:0%;width:22%;height:6%}#medicalPage .msg1{top:37.5%;height:16%}#medicalPage .msg2{top:54.5%;height:16%}#medicalPage .msg3{top:71.5%;height:16%}@media(max-aspect-ratio:864/1536){#medicalPage .art{width:100vw;height:auto;align-self:center;aspect-ratio:864/1536}}#screen.sos-image{background:#090000 url('sos.png') center center/contain no-repeat;padding:0;animation:none}#screen.sos-image strong,#screen.sos-image #stop{display:none}#screen.sos-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.sos-image::after{content:'';position:absolute;inset:0;pointer-events:none;background:rgba(255,255,255,.20);animation:sosPulse .55s steps(1) infinite}@keyframes sosPulse{0%,30%,60%,100%{opacity:0}10%,40%{opacity:1}}@media(prefers-reduced-motion:reduce){#screen.sos-image::after{animation:none}} #screen.malaise-image{background:#03051b url('malaise.png') center center/contain no-repeat;padding:0;animation:none}#screen.malaise-image strong,#screen.malaise-image #stop{display:none}#screen.malaise-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.saignement-image{background:#100000 url('saignement.png') center center/contain no-repeat;padding:0;animation:none}#screen.saignement-image strong,#screen.saignement-image #stop{display:none}#screen.saignement-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.poste-image{background:#03051b url('poste-secours.png') center center/contain no-repeat;padding:0;animation:none}#screen.poste-image strong,#screen.poste-image #stop{display:none}#screen.poste-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.passer-image{background:#031003 url('laissez-passer.png') center center/contain no-repeat;padding:0;animation:none}#screen.passer-image strong,#screen.passer-image #stop{display:none}#screen.passer-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.urgence-image{background:#100000 url('urgence-medicale.png') center center/contain no-repeat;padding:0;animation:none}#screen.urgence-image strong,#screen.urgence-image #stop{display:none}#screen.urgence-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.secours-image{background:#03051b url('laissez-passer-secours.png') center center/contain no-repeat;padding:0;animation:none}#screen.secours-image strong,#screen.secours-image #stop{display:none}#screen.secours-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.liberer-image{background:#100000 url('liberez-le-passage.png') center center/contain no-repeat;padding:0;animation:none}#screen.liberer-image strong,#screen.liberer-image #stop{display:none}#screen.liberer-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}</style></head><body><section id="landing" aria-label="Accueil MEDFLASH"><div class="art"><button class="hot fest" id="enterfestival" aria-label="Ouvrir le mode Festivalier"></button><button class="hot med" id="entermedical" aria-label="Ouvrir le mode Service médical"></button></div></section><section id="festivalPage" hidden aria-label="Mode Festivalier"><div class="art"><button class="return" id="festivalreturn" aria-label="Retour accueil"></button><button class="msg1" aria-label="SOS – Appelez les secours"></button><button class="msg2" aria-label="Je fais un malaise"></button><button class="msg3" aria-label="Je saigne beaucoup"></button><button class="msg4" aria-label="Accompagnez-moi au poste de secours"></button><button class="msg5" aria-label="Laissez-moi passer"></button></div></section><section id="medicalPage" hidden aria-label="Mode Service médical"><div class="art"><button class="return" id="medicalreturn" aria-label="Retour accueil"></button><button class="msg1" aria-label="Urgence médicale – Écartez-vous"></button><button class="msg2" aria-label="Laissez passer les secours"></button><button class="msg3" aria-label="Libérez le passage"></button></div></section><main id="home" hidden><button id="homeback">← ACCUEIL</button><h1>MEDFLASH</h1><p>Communiquer sans parler, même en plein concert.</p><div class="modes"><button id="festival" aria-pressed="true">FESTIVALIER</button><button id="medical" aria-pressed="false">SERVICE MÉDICAL</button></div><section id="messages" class="messages"></section><p class="notice">En cas d'urgence, appelez le 112. Cette application n'appelle pas automatiquement les secours.</p></main><section id="screen" hidden role="dialog" aria-modal="true"><button id="back">← RETOUR</button><strong id="big"></strong><button id="stop">ARRÊTER LES FLASHS</button></section><script>const fest=["SOS – APPELEZ LES SECOURS","JE FAIS UN MALAISE","JE SAIGNE BEAUCOUP","ACCOMPAGNEZ-MOI AU POSTE DE SECOURS","LAISSEZ-MOI PASSER"];const med=["URGENCE MÉDICALE – ÉCARTEZ-VOUS","LAISSEZ PASSER LES SECOURS","LIBÉREZ LE PASSAGE"];let current=fest;const el=id=>document.getElementById(id);function render(){el("messages").replaceChildren(...current.map((m,i)=>{const b=document.createElement("button");b.textContent=m;b.onclick=()=>{el("big").textContent=m;el("screen").hidden=false;el("screen").classList.toggle("flash",current===fest&&i===0);el("stop").hidden=!(current===fest&&i===0);el("back").focus()};return b}))}function mode(m){current=m;el("festival").setAttribute("aria-pressed",m===fest);el("medical").setAttribute("aria-pressed",m===med);render()}el("festival").onclick=()=>mode(fest);el("medical").onclick=()=>mode(med);el("back").onclick=()=>{el("screen").hidden=true;el("screen").classList.remove("flash","sos-image","malaise-image","saignement-image","poste-image","passer-image","urgence-image","secours-image","liberer-image")};el("stop").onclick=()=>{el("screen").classList.remove("flash");el("stop").hidden=true};document.addEventListener("keydown",e=>{if(e.key==="Escape")el("back").click()});el("enterfestival").onclick=()=>{mode(fest);el("landing").hidden=true;el("festivalPage").hidden=false};el("entermedical").onclick=()=>{mode(med);el("landing").hidden=true;el("medicalPage").hidden=false};el("homeback").onclick=()=>{el("home").hidden=true;el("landing").hidden=false};el("festivalreturn").onclick=()=>{el("festivalPage").hidden=true;el("landing").hidden=false};document.querySelectorAll("#festivalPage .art button:not(.return)").forEach((b,i)=>b.onclick=()=>{el("big").textContent=fest[i];el("screen").hidden=false;el("screen").classList.toggle("sos-image",i===0);el("screen").classList.toggle("malaise-image",i===1);el("screen").classList.toggle("saignement-image",i===2);el("screen").classList.toggle("poste-image",i===3);el("screen").classList.toggle("passer-image",i===4);el("screen").classList.remove("flash");el("stop").hidden=true;el("back").focus()});el("medicalreturn").onclick=()=>{el("medicalPage").hidden=true;el("landing").hidden=false};document.querySelectorAll("#medicalPage .art button:not(.return)").forEach((b,i)=>b.onclick=()=>{el("big").textContent=med[i];el("screen").hidden=false;el("screen").classList.toggle("urgence-image",i===0);el("screen").classList.toggle("secours-image",i===1);el("screen").classList.toggle("liberer-image",i===2);el("screen").classList.remove("flash");el("stop").hidden=true;el("back").focus()});render();</script></body></html>
