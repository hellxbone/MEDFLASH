-moi passer"></button></div></section><section id="screen" hidden role="dialog" aria-modal="true"><button id="back" aria-label="Retour">← RETOUR</button><strong id="big"></strong><button id="stop" hidden>ARRÊTER LES FLASHS</button></section><script>const shareUrl="https://hellxbone.github.io/MEDFLASH/";const shareMessage="Découvre MEDFLASH — Ça peut sauver des vies ! L’application gratuite pour communiquer sans parler en festival : "+shareUrl;document.getElementById("shareHome").addEventListener("click",()=>{const feedback=document.getElementById("shareFeedback");if(typeof navigator.share==="function"){navigator.share({title:"MEDFLASH",text:shareMessage}).then(()=>{feedback.textContent=""}).catch(e=>{if(e.name!=="AbortError")showShareOptions()});return}showShareOptions()});function showShareOptions(){const panel=document.getElementById("shareOptions");panel.hidden=false;document.getElementById("shareFeedback").textContent=""}function closeShareOptions(){document.getElementById("shareOptions").hidden=true}document.getElementById("shareClose").onclick=closeShareOptions;document.getElementById("shareWhatsApp").onclick=()=>{window.location.href="https://api.whatsapp.com/send?text="+encodeURIComponent(shareMessage)};document.getElementById("shareSMS").onclick=()=>{window.location.href="sms:?body="+encodeURIComponent(shareMessage)};document.getElementById("shareCopy").onclick=async()=>{try{await navigator.clipboard.writeText(shareUrl);document.getElementById("shareFeedback").textContent="Lien copié !";closeShareOptions()}catch(e){document.getElementById("shareFeedback").textContent=shareUrl}};const fest=["SOS – APPELEZ LES SECOURS","JE FAIS UN MALAISE","JE SAIGNE BEAUCOUP","ACCOMPAGNEZ-MOI AU POSTE DE SECOURS","LAISSEZ-MOI PASSER"];const el=id=>document.getElementById(id);let upsideDown=false,permissionRequested=false,lastMotionAt=0,orientationCandidate=null,orientationCount=0;function updateUpsideDown(value){upsideDown=value;el("screen").classList.toggle("auto-upside-down",value)}function resetOrientation(){el("screen").classList.toggle("auto-upside-down",upsideDown)}function applyOrientation(inverted){if(orientationCandidate!==inverted){orientationCandidate=inverted;orientationCount=1}else orientationCount++;if(orientationCount>=2)updateUpsideDown(inverted)}function onPhoneMotion(e){const a=e.accelerationIncludingGravity;if(!a||!Number.isFinite(a.y)||!Number.isFinite(a.x))return;if(Math.abs(a.y)<5||Math.abs(a.x)>6.5)return;lastMotionAt=Date.now();applyOrientation(a.y<0)}function onPhoneOrientation(e){if(Date.now()-lastMotionAt<1200)return;if(!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return;if(Math.abs(e.gamma)>55||Math.abs(e.beta)<40)return;applyOrientation(e.beta<0)}window.addEventListener("devicemotion",onPhoneMotion,{passive:true});window.addEventListener("deviceorientation",onPhoneOrientation,{passive:true});function requestOrientation(){if(permissionRequested)return;permissionRequested=true;for(const C of [window.DeviceMotionEvent,window.DeviceOrientationEvent]){if(C&&typeof C.requestPermission==="function")C.requestPermission().catch(()=>{})}}const entry=el("enterfestival");let holdTimer=null;let holdStart=0;let holdPointer=null;let holdKey=null;const openFestival=()=>{cancelHold();el("landing").hidden=true;el("festivalPage").hidden=false};function cancelHold(){clearTimeout(holdTimer);holdTimer=null;holdStart=0;holdPointer=null;holdKey=null;entry.setAttribute("aria-label","Maintenir le bouton SOS pendant 5 secondes pour ouvrir les messages");}function startHold(source){if(holdTimer!==null)return;holdStart=Date.now();entry.setAttribute("aria-label","Maintenir SOS pendant 5 secondes");holdTimer=setTimeout(()=>{holdTimer=null;openFestival()},5000)}entry.style.touchAction="none";entry.addEventListener("contextmenu",e=>e.preventDefault());entry.addEventListener("click",e=>e.preventDefault());entry.addEventListener("pointerdown",e=>{requestOrientation();if(e.button!==0||holdTimer!==null)return;holdPointer=e.pointerId;try (function(){

}catch(e){status.textContent='Statistiques indisponibles. Réessaie plus tard.'}}
function start(){if(timer!==null)return;timer=setTimeout(show,5000)}
