left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.poste-image{background:#03051b url('poste-secours.png') center center/contain no-repeat;padding:0;animation:none}#screen.poste-image strong,#screen.poste-image #stop{display:none}#screen.poste-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.passer-image{background:#031003 url('laissez-passer.png') center center/contain no-repeat;padding:0;animation:none}#screen.passer-image strong,#screen.passer-image #stop{display:none}#screen.passer-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.urgence-image{background:#100000 url('urgence-medicale.png') center center/contain no-repeat;padding:0;animation:none}#screen.urgence-image strong,#screen.urgence-image #stop{display:none}#screen.urgence-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.secours-image{background:#03051b url('laissez-passer-secours.png') center center/contain no-repeat;padding:0;animation:none}#screen.secours-image strong,#screen.secours-image #stop{display:none}#screen.secours-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.liberer-image{background:#100000 url('liberez-le-passage.png') center center/contain no-repeat;padding:0;animation:none}#screen.liberer-image strong,#screen.liberer-image #stop{display:none}#screen.liberer-image #back{position:absolute;top:0;right:0;left:auto;width:20%;height:11%;min-height:0;padding:0;border:0;background:transparent;color:transparent;font-size:0;z-index:5}#screen.urgence-image #back,#screen.secours-image #back,#screen.liberer-image #back{left:2%;right:auto;top:2%;width:30%;height:10%;z-index:20;touch-action:manipulation}#medicalGate{position:fixed;inset:0;z-index:3;background:#05030b;display:flex;justify-content:center}#medicalGate[hidden]{display:none}#medicalGate .art{position:relative;height:100%;aspect-ratio:1024/1536;max-width:100vw;background:url('acces-service-medical.png') center/100% 100% no-repeat}#medicalGate .exit{position:absolute;top:0;left:0;width:24%;height:9%;background:transparent;border:0}#medicalGate .notice-lock{position:absolute;left:10%;width:80%;top:72%;background:#140b0bef;border:2px solid #ff3434;border-radius:10px;font-size:14px;line-height:1.35;padding:10px;color:white}#medicalGate .notice-lock strong{display:block;font-size:16px}#medicalGate .no-access{position:absolute;top:79%;left:18%;width:64%;height:8%;background:transparent;border:0}#organizerEntry{position:absolute;top:89%;left:16%;width:68%;height:7%;min-height:0;padding:4px;background:#161616;border:2px solid #76ff54;border-radius:12px;font-size:clamp(12px,3vw,17px);z-index:5}#workflow{position:fixed;inset:0;z-index:8;background:#040408;display:flex;align-items:center;justify-content:center;padding:8px}#workflow[hidden]{display:none}#workflow .panel{position:relative;width:min(100%,520px);height:min(96dvh,780px);aspect-ratio:1024/1536;background:#050505 center/100% 100% no-repeat;border:2px solid #e12b35;overflow:auto}#workflow .controls{position:absolute;bottom:3%;left:5%;width:90%;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}#workflow .controls button{min-height:44px;font-size:13px;padding:8px 10px;border-radius:8px;background:#111e16;border-color:#70ff5c}#workflow .close{position:absolute;right:2%;top:1%;z-index:4;min-height:44px;padding:5px 12px;background:#161616;border-color:#fff}#workflow .overlay{position:absolute;left:8%;right:8%;top:59%;padding:10px;background:#070707e8;border:1px solid #9fef75;border-radius:12px;font-size:13px;max-height:32%;overflow:auto}#workflow input,#workflow select{display:block;width:100%;padding:9px;margin:5px 0 9px;color:white;background:#10141c;border:1px solid #b9f7b2;border-radius:6px;font:inherit;font-size:14px}#workflow .overlay button{font-size:13px;min-height:40px;padding:6px;background:#27372a}#workflow .overlay p{margin:5px 0;color:white;font-size:12px}#workflow .warning{color:#ffcc9c;font-weight:700}</style></head><body><section id="landing" aria-label="Accueil MEDFLASH"><div class="art"><button class="hot fest" id="enterfestival" aria-label="Ouvrir le mode Festivalier"></button><button class="hot med" id="entermedical" aria-label="Ouvrir le mode Service médical"></button></div></section><section id="festivalPage" hidden aria-label="Mode Festivalier"><div class="art"><button class="return" id="festivalreturn" aria-label="Retour accueil"></button><button class="msg1" aria-label="SOS – Appelez les secours"></button><button class="msg2" aria-label="Je fais un malaise"></button><button class="msg3" aria-label="Je saigne beaucoup"></button><button class="msg4" aria-label="Accompagnez-moi au poste de secours"></button><button class="msg5" aria-label="Laissez-moi passer"></button></div></section><section id="medicalGate" hidden aria-label="Accès médical réservé"><div class="art"><button class="exit" id="gateexit" aria-label="Retour à l’accueil"></button><div class="notice-lock"><strong>ACCÈS NON ACTIVÉ</strong>Autorisation organisateur et vérification sécurisée nécessaires. Aucun code ne fonctionne pour le moment.</div><button class="no-access" id="gatelocked" aria-label="Accès non activé"></button><button id="organizerEntry" type="button">ESPACE ORGANISATEUR</button></div></section><section id="medicalPage" hidden aria-label="Mode Service médical"><div class="art"><button class="return" id="medicalreturn" aria-label="Retour accueil"></button><button class="msg1" aria-label="Urgence médicale – Écartez-vous"></button><button class="msg2" aria-label="Laissez passer les secours"></button><button class="msg3" aria-label="Libérez le passage"></button></div></section><section id="workflow" hidden aria-label="Parcours organisateur et invitations"><div class="panel" id="workflowPanel"><button class="close" id="workflowClose" aria-label="Fermer">✕</button><div class="overlay" id="workflowOverlay"></div><div class="controls" id="workflowControls"></div></div></section><main id="home" hidden><button id="homeback">← ACCUEIL</button><h1>MEDFLASH</h1><p>Communiquer sans parler, même en plein concert.</p><div class="modes"><button id="festival" aria-pressed="true">FESTIVALIER</button><button id="medical" aria-pressed="false">SERVICE MÉDICAL</button></div><section id="messages" class="messages"></section><p class="notice">En cas d'urgence, appelez le 112. Cette application n'appelle pas automatiquement les secours.</p></main><section id="screen" hidden role="dialog" aria-modal="true"><button id="back">← RETOUR</button><strong id="big"></strong><button id="stop">ARRÊTER LES FLASHS</button></section><script>const fest=["SOS – APPELEZ LES SECOURS","JE FAIS UN MALAISE","JE SAIGNE BEAUCOUP","ACCOMPAGNEZ-MOI AU POSTE DE SECOURS","LAISSEZ-MOI PASSER"];const med=["URGENCE MÉDICALE – ÉCARTEZ-VOUS","LAISSEZ PASSER LES SECOURS","LIBÉREZ LE PASSAGE"];let current=fest;const el=id=>document.getElementById(id);function render(){el("messages").replaceChildren(...current.map((m,i)=>{const b=document.createElement("button");b.textContent=m;b.onclick=()=>{el("big").textContent=m;el("screen").hidden=false;el("screen").classList.toggle("flash",current===fest&&i===0);el("stop").hidden=!(current===fest&&i===0);el("back").focus()};return b}))}function mode(m){current=m;el("festival").setAttribute("aria-pressed",m===fest);el("medical").setAttribute("aria-pressed",m===med);render()}el("festival").onclick=()=>mode(fest);el("medical").onclick=()=>mode(med);el("back").onclick=()=>{el("screen").hidden=true;el("screen").classList.remove("flash","sos-image","malaise-image","saignement-image","poste-image","passer-image","urgence-image","secours-image","liberer-image")};el("stop").onclick=()=>{el("screen").classList.remove("flash");el("stop").hidden=true};document.addEventListener("keydown",e=>{if(e.key==="Escape")el("back").click()});el("enterfestival").onclick=()=>{mode(fest);el("landing").hidden=true;el("festivalPage").hidden=false};el("entermedical").onclick=()=>{el("landing").hidden=true;el("medicalGate").hidden=false};el("gateexit").onclick=()=>{el("medicalGate").hidden=true;el("landing").hidden=false};el("gatelocked").onclick=()=>{el("medicalGate").querySelector(".notice-lock").focus?.()};el("homeback").onclick=()=>{el("home").hidden=true;el("landing").hidden=false};el("festivalreturn").onclick=()=>{el("festivalPage").hidden=true;el("landing").hidden=false};document.querySelectorAll("#festivalPage .art button:not(.return)").forEach((b,i)=>b.onclick=()=>{el("big").textContent=fest[i];el("screen").hidden=false;el("screen").classList.toggle("sos-image",i===0);el("screen").classList.toggle("malaise-image",i===1);el("screen").classList.toggle("saignement-image",i===2);el("screen").classList.toggle("poste-image",i===3);el("screen").classList.toggle("passer-image",i===4);el("screen").classList.remove("flash");el("stop").hidden=true;el("back").focus()});el("medicalreturn").addEventListener("click",e=>{e.preventDefault();e.stopPropagation();el("medicalPage").hidden=true;el("landing").hidden=false;});document.querySelectorAll("#medicalPage .art button:not(.return)").forEach((b,i)=>b.onclick=()=>{el("big").textContent=med[i];el("screen").hidden=false;el("screen").classList.toggle("urgence-image",i===0);el("screen").classList.toggle("secours-image",i===1);el("screen").classList.toggle("liberer-image",i===2);el("screen").classList.remove("flash");el("stop").hidden=true;el("back").focus()});// Make the medical fullscreen return control work reliably on touch devices.
const medicalFullscreenClasses=["urgence-image","secours-image","liberer-image"];
function closeMedicalFullscreen(e){
  if(!medicalFullscreenClasses.some(name=>el("screen").classList.contains(name)))return;
  e.preventDefault();
  e.stopPropagation();
  el("back").click();
}
el("screen").addEventListener("pointerup",e=>{
  if(!medicalFullscreenClasses.some(name=>el("screen").classList.contains(name)))return;
  const rect=el("screen").getBoundingClientRect();
  if(e.clientY<=rect.top+rect.height*.12 && (e.clientX<=rect.left+rect.width*.34 || e.clientX>=rect.right-rect.width*.18))closeMedicalFullscreen(e);
});

const wfSteps=[
 ["espace-organisateur.png","Espace organisateur"],
 ["creer-festival-v2.png","Créer un festival"],
 ["verification-organisateur.png","Vérifier l'organisateur"],
 ["etapes-verification-organisateur.png","Étapes de vérification"],
 ["verification-en-attente.png","Vérification en attente"],
 ["verification-refusee.png","Vérification refusée"],
 ["corriger-demande-organisateur.png","Corriger une demande"],
 ["demande-renvoyee.png","Demande renvoyée"],
 ["organisateur-verifie.png","Organisateur vérifié"],
 ["inviter-soignant.png","Inviter un soignant"],
 ["invitation-envoyee.png","Invitation envoyée"],
 ["accepter-invitation-medicale.png","Invitation médicale"],
 ["invitation-acceptee.png","Invitation acceptée"],
 ["invitation-refusee.png","Invitation refusée"],
 ["invitation-expiree.png","Invitation expirée"],
 ["acces-medical-non-autorise.png","Accès médical non autorisé"],
 ["acces-revoque.png","Accès révoqué"]
];
let wfIndex=0;
function wfShow(i){
 wfIndex=Math.max(0,Math.min(wfSteps.length-1,i));
 const [asset,title]=wfSteps[wfIndex];
 el("workflow").hidden=false;
 el("workflowPanel").style.backgroundImage='url("'+asset+'")';
 const overlay=el("workflowOverlay"),controls=el("workflowControls");
 overlay.replaceChildren();controls.replaceChildren();
 const notice=document.createElement("p");
 notice.className="warning";
 notice.textContent="PARCOURS EN PRÉPARATION — aucun compte, dossier ou accès médical n'est encore validé par un serveur.";
 overlay.append(notice);
 if(wfIndex===1||wfIndex===6){
  const form=document.createElement("form");
  const fields=wfIndex===1?[["Nom du festival","text"],["Lieu","text"],["Date de début","date"],["Date de fin","date"]]:[["Nom de l'organisateur","text"],["E-mail de contact","email"]];
  for(const [label,type] of fields){const l=document.createElement("label");l.textContent=label;const inp=document.createElement("input");inp.type=type;inp.required=true;l.append(inp);form.append(l)}
  const save=document.createElement("button");save.type="submit";save.textContent="VÉRIFIER LES CHAMPS";form.append(save);
  const status=document.createElement("p");form.append(status);
  form.onsubmit=e=>{e.preventDefault();status.textContent="Champs vérifiés sur cet appareil. Aucune demande n'a été envoyée : service sécurisé non configuré."};
  overlay.append(form);
 } else if(wfIndex===9){
  const p=document.createElement("p");p.textContent="L'envoi d'invitations est désactivé jusqu'à l'activation de l'authentification et de la validation des organisateurs.";overlay.append(p);
 } else {
  const p=document.createElement("p");p.textContent=title+" — aperçu graphique uniquement. Cet état doit être confirmé par le service sécurisé avant d'être affiché à un utilisateur.";overlay.append(p);
 }
 const nav=(label,to)=>{const b=document.createElement("button");b.type="button";b.textContent=label;b.onclick=()=>wfShow(to);controls.append(b)};
 if(wfIndex>0)nav("← PRÉCÉDENT",wfIndex-1);
 if(wfIndex<wfSteps.length-1)nav("SUIVANT →",wfIndex+1);
}
el("organizerEntry").onclick=()=>{el("medicalGate").hidden=true;wfShow(0)};
el("workflowClose").onclick=()=>{el("workflow").hidden=true;el("medicalGate").hidden=false};
render();</script></body></html>
